# Render Blueprint for the backend API (free plan).
# Database: an external PostgreSQL (e.g. Neon free tier); set DATABASE_URL in the dashboard.
services:
  - type: web
    name: quiz-builder-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
